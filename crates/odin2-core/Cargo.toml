[package]
name = "odin2-core"
version = "0.1.0"
edition = "2021"
description = "Odin 2 synthesizer core DSP engine in Rust"
license = "GPL-3.0"
repository = "https://github.com/bascanada/odin2-rs"

[lib]
crate-type = ["lib"]

[[bin]]
name = "odin2-demo"
path = "src/bin/demo.rs"
required-features = ["std"]

[[bin]]
name = "morph-demo"
path = "src/bin/morph_demo.rs"
required-features = ["std"]

[features]
default = []
std = ["hound"]

[dependencies]
libm = "0.2"
wide = "0.7"
hound = { version = "3.5", optional = true }

[dev-dependencies]
hound = "3.5"
